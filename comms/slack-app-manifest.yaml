display_information:
  name: AEGIS
  description: AEGIS personal AI orchestration (sebas, raphael, maou, pandora)
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: AEGIS
    always_online: true
  slash_commands:
    - command: /capture
      description: Capture a thought to your GTD inbox
      usage_hint: "[text]"
      should_escape: false
    - command: /remember
      description: File a fact about your life into the knowledge store
      usage_hint: "[text]"
      should_escape: false
    - command: /status
      description: Show AEGIS system status
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - files:write
      - channels:read
      - channels:history
      - channels:manage
      - groups:read
      # A note-to-self channel is naturally PRIVATE. Without groups:history the
      # `:brain:` reaction lane 403s `missing_scope` on conversations.history
      # and files nothing.
      - groups:history
      - app_mentions:read
      - commands
      - im:history
      - im:read
      - users:read
      - reactions:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      # ...and without message.groups no message event is ever delivered from a
      # private channel, so the note-to-self lane never fires there either.
      - message.groups
      - message.im
      - app_mention
      - file_shared
      - reaction_added
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
