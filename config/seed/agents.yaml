# v3 agent seeds. Loader upserts by id.
# Each personality's SOUL/AGENTS/MEMORY/USER markdown lives at
# personalities/<id>/{SOUL,AGENTS,MEMORY,USER}.md — system_prompt_path
# points at the directory; chat service composes from the four files.

agents:
  - id: sebas
    name: Sebas Tian
    role: Executive assistant
    system_prompt_path: personalities/sebas
    # `gtd` is a behavior tag (aegis.agent_tags) — routing keys on it, not on the id.
    capabilities: [gtd, email, calendar, github_alerts, daily_brief]
    model_tier: smart
    interaction_timeout_default: archive
    slack_channel_id: ""
    elevenlabs_voice_id: ""
    metadata:
      intent_description: Tasks, GTD, email, calendar, scheduling and day-to-day coordination.
      # Slack persona icon (chat:write.customize); :robot_face: when unset.
      slack_icon: ":bust_in_silhouette:"
      intent_keywords: [task, todo, inbox, remind, defer, project, "next action", calendar, email, waiting, schedule, "follow up", journal, diary, "day log", meeting]
      knowledge_domains: [task, decision, briefing, digest, calendar, task_outcome]
      tool_set: [query_activities, trigger_workflow, search_knowledge, ask_knowledge, configure_triage, remember_this, merge_problems, list_interactions, capture_to_inbox, list_next_actions, whats_next, list_projects, complete_task, defer_task, mark_waiting, handoff_task, find_reference, youtube_transcript, pdf_to_text, system_status, social_timeline, list_social_channels]
    active: true

  - id: raphael
    name: Raphael Ainz Ooal Gown
    role: Research and knowledge
    system_prompt_path: personalities/raphael
    capabilities: [knowledge_search, research, ingest, rss, raindrop]
    model_tier: smart
    interaction_timeout_default: hold
    slack_channel_id: ""
    elevenlabs_voice_id: ""
    metadata:
      intent_description: Research, knowledge lookups, articles, papers and topic tracking.
      slack_icon: ":books:"
      intent_keywords: [research, knowledge, learn, paper, article, summari, remember, recall, explain, note, vault, obsidian]
      knowledge_domains: [article, feed, email, research]
      tool_set: [search_knowledge, ask_knowledge, research_topic, web_search, read_url, paper_search, paper_read, github_issues, list_feeds, subscribe_feed, unsubscribe_feed, library_search, library_book, library_read, library_suggest, note_search, note_read, note_write, note_link, track_topic, untrack_topic, remember_this, merge_problems, capture_to_inbox, list_next_actions, list_projects, complete_task, handoff_task, find_reference, youtube_transcript, pdf_to_text]
    active: true

  - id: maou
    name: Maou
    role: Finance
    system_prompt_path: personalities/maou
    capabilities: [finance, receipts, subscriptions, market]
    model_tier: smart
    interaction_timeout_default: archive
    slack_channel_id: ""
    elevenlabs_voice_id: ""
    metadata:
      intent_description: Money — bills, receipts, subscriptions, budgets and market data.
      slack_icon: ":moneybag:"
      intent_keywords: [money, bill, invoice, subscription, payment, receipt, spend, cost, budget, renew, charge, refund, expense, price, market, stock, crypto, portfolio]
      knowledge_domains: [market, finance, trade]
      tool_set: [get_quote, get_market_overview, get_finance_news, search_knowledge, ask_knowledge, remember_this, merge_problems, list_interactions, capture_to_inbox, list_next_actions, list_projects, complete_task, defer_task, mark_waiting, handoff_task, desk_status]
    active: true

  - id: pandoras-actor
    name: Pandora's Actor
    role: Infrastructure
    system_prompt_path: personalities/pandoras-actor
    # `infra` is a behavior tag (aegis.agent_tags) — routing keys on it, not on the id.
    capabilities: [infra, homelab, k8s, argocd, certs, drift]
    model_tier: smart
    interaction_timeout_default: archive
    slack_channel_id: ""
    elevenlabs_voice_id: ""
    metadata:
      intent_description: Infrastructure — homelab, Docker swarm, Kubernetes, deployments and alerts.
      slack_icon: ":robot_face:"
      intent_keywords: [server, docker, swarm, k8s, kubernetes, deploy, infra, drift, backup, cert, argocd, pod, container, node, homelab, restart, logs, grafana, prometheus]
      mention_aliases: [pandora]
      async_dispatch: true
      knowledge_domains: [alert, sentry, github, task_outcome]
      tool_set: [trigger_workflow, create_schedule, search_knowledge, ask_knowledge, configure_triage, remember_this, merge_problems, list_interactions, capture_to_inbox, list_next_actions, list_projects, complete_task, defer_task, handoff_task]
    # Retired: the infra lane left v1 (migration 054). Kept as a row because
    # other tables point at it.
    active: false

  # Virtual placeholder for general-topic dispatches and system events.
  # Never participates in chat — only exists to satisfy the FK on
  # chat_history.agent_id for role='dispatch' rows where the dispatch isn't
  # tied to a specific personality (e.g. system-level messages from
  # aegis_comms.__main__ with agent_id='system', or log_dispatch's default
  # fallback in core/api/routes/chat.py).
  - id: system
    name: System
    role: Virtual agent for system-level dispatch logging only
    system_prompt_path: ""
    capabilities: []
    model_tier: balanced
    interaction_timeout_default: archive
    slack_channel_id: ""
    active: false
