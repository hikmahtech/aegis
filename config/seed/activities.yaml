# v3 activities seed. Loader upserts by slug.

activities:
  # Sebas — email & calendar ingestion
  - slug: gmail-ingest-hourly
    workflow_type: GmailIngestFlow
    agent_id: sebas
    schedule_cron: "0 * * * *"
    config: {}
    active: true

  - slug: calendar-ingest-daily
    workflow_type: CalendarIngestFlow
    agent_id: sebas
    schedule_cron: "0 6 * * *"
    config:
      horizon_days: 30
    active: true

  # GTD layer — Phase 1 (Todoist sync only)
  - slug: todoist-sync-5min
    workflow_type: TodoistSyncFlow
    agent_id: sebas
    schedule_cron: "*/5 * * * *"
    config: {}
    active: true

  # GTD layer — Phase 3 (Clarify)
  - slug: gtd-clarify-15min
    workflow_type: ClarifyFlow
    agent_id: sebas
    schedule_cron: "*/15 * * * *"
    config:
      max_items: 20
    active: true

  # GTD layer — Phase 5 (Reviews). Crons in UTC; IST = UTC+5:30.
  #   daily : 02:30 UTC = 08:00 IST every day
  #   weekly: 03:30 UTC Sunday = 09:00 IST Sunday
  - slug: gtd-daily-review
    workflow_type: DailyReviewFlow
    agent_id: sebas
    schedule_cron: "30 2 * * *"
    config: {}
    active: true

  - slug: gtd-weekly-review
    workflow_type: WeeklyReviewFlow
    agent_id: sebas
    schedule_cron: "30 3 * * 0"
    config: {}
    active: true

  # Maou — weekly receipt safety-net. Per-message money hygiene is owned by
  # GmailIngestFlow's tag-based fan-out (financial/payments → MoneyProcessFlow).
  # This run only catches anything the hourly triage missed. The receipt-shaped
  # sender filter is hardcoded in the flow; only the time window is configurable.
  - slug: receipt-ingest-weekly
    workflow_type: ReceiptIngestFlow
    agent_id: maou
    schedule_cron: "0 5 * * 0"
    config:
      query_window: "newer_than:14d"
    active: true

  # Daily recurring-charge sweep (merged cancellation-scan + renewal-radar:
  # both ran daily off the same recurring_charge table). 09:00 UTC = 14:30 IST.
  - slug: money-hygiene-daily
    workflow_type: MoneyHygieneDailyFlow
    agent_id: maou
    schedule_cron: "0 9 * * *"
    config:
      threshold_multiplier: 2.0
      thresholds_days: [30, 14, 7, 0]
    active: true

  - slug: subscription-audit-monthly
    workflow_type: SubscriptionAuditFlow
    agent_id: maou
    schedule_cron: "0 10 1 * *"
    config: {}
    active: true

  # Social publishing — a Todoist task (@publish + platform labels, due time =
  # post time) becomes a post after an approval card. Ships inert: the
  # social_publishing_enabled settings row (migration 005) defaults to false.
  # channel_sync_minutes: how stale the social_accounts mirror of Postiz's
  # connected channels may get before the tick re-syncs it (#182). The mirror
  # is what a Todoist platform label resolves against, so a channel connected
  # in Postiz is unpublishable until it lands here.
  - slug: social-publish-5min
    workflow_type: SocialPublishFlow
    agent_id: sebas
    schedule_cron: "*/5 * * * *"
    config:
      channel_sync_minutes: 60
    active: true

  # Daily Postiz analytics pull into social_outbox.metrics (Postiz-routed
  # accounts only). Harmless while social_publishing_enabled is false.
  - slug: social-metrics-daily
    workflow_type: SocialMetricsFlow
    agent_id: sebas
    schedule_cron: "30 3 * * *"
    config: {}
    active: true

  # Raphael — daily briefing (carries the "References filed" digest for
  # #research / #email reference closure per the references-as-knowledge
  # spec; per-message chat notifications only fire for user-initiated #chat / #manual
  # sources, so this digest is the only signal the user gets for automated
  # ingest closure). Cron 04:30 UTC = 10:00 IST.
  - slug: daily-briefing-raphael
    workflow_type: DailyBriefingFlow
    agent_id: raphael
    schedule_cron: "30 4 * * *"
    config: {}
    active: true

  # Raphael — nightly episodic diary (A8). One dated knowledge entry per day
  # so retrieval has a timeline, not just topics. Cron 19:00 UTC = 00:30 IST,
  # i.e. just after the IST day closes — the run's own UTC date IS the day
  # being logged, so day_offset stays 0.
  - slug: daylog-nightly
    workflow_type: DayLogFlow
    agent_id: raphael
    schedule_cron: "0 19 * * *"
    config: {}
    active: true

  # Raphael — weekly rollup (A9), same flow class with mode=weekly. Sunday
  # 20:20 UTC: after the 19:00 UTC nightly entry for that same Sunday lands,
  # so the ISO week (Mon-Sun) it summarises is complete. Minute :20 on
  # purpose — minute :00 is the busiest slot in this file (two hourly flows
  # plus every */N schedule land there), and :30 is the next busiest.
  - slug: daylog-weekly
    workflow_type: DayLogFlow
    agent_id: raphael
    schedule_cron: "20 20 * * 0"
    config:
      mode: weekly
    active: true

  # Raphael — monthly rollup (A9), mode=monthly. Cron has no last-day-of-month
  # operator, so this fires on days 28-31 and DayLogFlow's own guard drops
  # every run except the real month end (correct for February, 30- and
  # 31-day months alike). 21:20 UTC on that day, i.e. after both the 19:00
  # nightly entry and any 20:20 weekly run for the same date.
  - slug: daylog-monthly
    workflow_type: DayLogFlow
    agent_id: raphael
    schedule_cron: "20 21 28-31 * *"
    config:
      mode: monthly
    active: true

  # Sebas — A7, one curiosity question per day (at most). 09:30 UTC = 15:00 IST:
  # a mid-afternoon question, deliberately away from both the 04:30 briefing and
  # the 09:00 money-hygiene run, and off the crowded :00 / :30-of-every-hour
  # slots that the ingest flows own. The flow gates itself on the notification
  # budget, so this cron is an upper bound, not a promise of a daily card.
  # NOTE: `config` is DB-owned (seed.py only refreshes workflow_type/agent_id) —
  # on an existing deploy tune max_per_day on /admin/flows, not here.
  - slug: curiosity-daily
    workflow_type: CuriosityCardFlow
    agent_id: sebas
    schedule_cron: "30 9 * * *"
    config: {max_per_day: 1}
    active: true

  # Sebas — A2, one proposed edit to his own `user` persona doc per week,
  # delivered as a draft_review card that a human must approve before anything
  # is written. 02:23 UTC Sunday = 07:53 IST.
  #
  # The minute matters more than the hour here. The spec proposed "0 2 * * 0",
  # but minute :00 of EVERY hour is the busiest slot in this file — two hourly
  # flows plus the */2, */5, */15 and */30 steppers all fire there — and this is
  # an LLM flow whose whole point was to avoid a crowded cluster. :23 is hit by
  # no stepper (odd, not a multiple of 5) and by no fixed-minute row, and it
  # sits clear of the Sunday 03:30/05:00 review cluster.
  # NOTE: `config` is DB-owned (seed.py only refreshes workflow_type/agent_id) —
  # on an existing deploy tune lookback_days on /admin/flows, not here.
  - slug: profile-reflection-weekly
    workflow_type: ProfileReflectionFlow
    agent_id: sebas
    schedule_cron: "23 2 * * 0"
    config: {lookback_days: 7, max_per_day: 1}
    active: true

  # Raphael — knowledge ingestion (raindrop + rss + intel scans)
  - slug: raindrop-ingest-2h
    workflow_type: RaindropIngestFlow
    agent_id: raphael
    schedule_cron: "0 */2 * * *"
    config: {}
    active: true

  - slug: rss-ingest-hourly
    workflow_type: RssIngestFlow
    agent_id: raphael
    schedule_cron: "30 * * * *"
    config: {}
    active: true

  # Sebas — B7 wearable vendor poll into life.observations.
  #
  # Cron 50 */6: 00:50 / 06:50 / 12:50 / 18:50 UTC. Minute :50 is used by no
  # other row in this file, and deliberately avoids the ingest crowd at :00 and
  # :30 and the */5 and */15 sweep minutes. Four times a day rather than the
  # hourly cadence feeds get: a wearable publishes DAILY summaries, so the only
  # thing extra polls buy is a shorter wait after the vendor finalises a day —
  # 6h covers any timezone's morning and lets a failed poll self-heal on the
  # next tick without a manual run. Data is deduped in the database, so an
  # overlapping window costs nothing.
  #
  # Inert until BOTH `oura_api_token` (Integrations) and the wearable channel
  # row (Channels, ships inactive) are set — until then the run reports
  # `no_channel` / `token_missing` instead of failing.
  - slug: wearable-ingest-6h
    workflow_type: WearableIngestFlow
    agent_id: sebas
    schedule_cron: "50 */6 * * *"
    config:
      # Days of history requested when the channel has no cursor yet, and the
      # floor the window is re-based to. Clamped to 30 in the activity.
      lookback_days: 7
    active: true

  # Watches ONE designated Google Drive folder, incrementally ingesting new/
  # changed docs (skip-unchanged by Drive modifiedTime). folder_id is empty by
  # default → the flow no-ops until a folder is designated. account = the gmail
  # OAuth label whose token (with drive.readonly) to use.
  - slug: drive-sync-raphael
    workflow_type: DriveSyncFlow
    agent_id: raphael
    schedule_cron: "15 */4 * * *"
    config: {account: "primary", folder_id: "", recurse: true, source_type: "drive"}
    active: true

  # Phase 4 — nightly per-agent memory consolidation (caps each agent's
  # agent_memory at `keep` rows; the learning loop writes corrections live).
  # consolidate: run the A4 planner first — it PROPOSES ADD/UPDATE/DELETE/NOOP
  # ops and writes every one of them to agent_memory_ops_log for inspection
  # (GET /api/admin/agents/sebas/memory/ops).
  #
  # dry_run: true is the intended LONG-RUNNING default. Applying a plan needs
  # BOTH dry_run: false here AND AEGIS_MEMORY_CONSOLIDATION_APPLY_ENABLED=true
  # in the worker environment — with the env var unset this pass plans and logs
  # but writes nothing, whatever this file or the DB says.
  # max_ops_pct / min_age_hours TIGHTEN the rails; the absolute op cap, the
  # importance floor and the [gmail:] dedupe-marker protection are code
  # constants that no config edit can widen.
  # retire_grace_days: 0 = soft-retired rows are never hard-deleted.
  #
  # NOTE: `config` is DB-owned (seed.py only refreshes workflow_type/agent_id),
  # so these keys apply to a FRESH install only — ON AN EXISTING DEPLOY EDITING
  # THIS FILE CHANGES NOTHING. Set them on /admin/flows.
  - slug: memory-reflection-nightly
    workflow_type: MemoryReflectionFlow
    agent_id: sebas
    schedule_cron: "0 3 * * *"
    config:
      keep: 50
      consolidate: true
      dry_run: true
      max_ops_pct: 0.25
      min_age_hours: 24
      retire_grace_days: 0
    active: true

  # significance_threshold: the LLM scorer rates 1–5; only items >= this ingest.
  # Was 5 (top-tier-only, since the 2026-05-19 over-volume). Lowered to 4 on
  # 2026-06-18 alongside the gemma4:e2b scorer swap (PR #320) — gemma4 scores a
  # touch more conservatively than gpt-oss, so 5 risks ingesting nothing.
  # NOTE: the runtime value comes from this config (the schedule_sync mapper
  # reads activities.config); the IntelligenceScanInput dataclass default is a
  # dead fallback. Tune per-source if needed.
  # Scan times must stay AHEAD of daily-briefing-raphael (04:30 UTC), which is
  # the only surface these items reach. They ran at 07:00/07:30/08:00 — i.e.
  # 2.5-3.5 hours AFTER the briefing that reports them — so every briefing
  # could only ever describe yesterday's scan. 01:00/01:30/02:00 leaves a >2h
  # margin for the */15 ClarifyFlow tick that turns the #research captures into
  # `source_type='reference'` rows, which the briefing also reads.
  - slug: intel-scan-hn
    workflow_type: IntelligenceScanFlow
    agent_id: raphael
    schedule_cron: "0 1 * * *"
    config:
      source: hn
      topics: [ai, systems, startups]
      significance_threshold: 4
    active: true

  - slug: intel-scan-news
    workflow_type: IntelligenceScanFlow
    agent_id: raphael
    schedule_cron: "30 1 * * *"
    config:
      source: news
      topics: [world, tech]
      significance_threshold: 4
    active: true

  - slug: intel-scan-finance
    workflow_type: IntelligenceScanFlow
    agent_id: raphael
    schedule_cron: "0 2 * * *"
    config:
      source: finance
      topics: [equities, macro, crypto]
      significance_threshold: 4
    active: true

  # Pandora — Sentry poll safety-net (webhook is the fast path)
  - slug: sentry-poll-30m
    workflow_type: SentryPollFlow
    agent_id: pandoras-actor
    schedule_cron: "*/30 * * * *"
    config:
      mode: poll
    active: true

  # Pandora — LLM spend guard. Ships ACTIVE but INERT: the rolling-24h token
  # budget lives in settings.llm_governor.daily_token_budget, which defaults
  # to 0 = disabled, so this is a no-op until a budget is set on the admin
  # Settings page (same ship-active-but-inert pattern as the social kill
  # switch). Over budget ⇒ flips settings.llm_kill_switch + system event.
  - slug: llm-spend-guard-15min
    workflow_type: LLMSpendGuardFlow
    agent_id: pandoras-actor
    schedule_cron: "*/15 * * * *"
    config: {}
    active: true

  # Pandora — proactive homelab monitoring (drift, certs)
  # Secondary AEGIS-side drift check (alertmanager DockerServiceDown/NodeDown
  # is the primary, fast path). Slowed hourly → 4h: it has found zero drift in
  # practice and the real alerting covers the urgent cases.
  - slug: service-drift-4h
    workflow_type: ServiceDriftFlow
    agent_id: pandoras-actor
    schedule_cron: "0 */4 * * *"
    config: {}
    active: true

  # Pandora — 2-min swarm liveness heartbeat (spec 2026-07-24). Primary fast
  # internal detector for node-down and post-reboot stuck services; emits only
  # on state transitions so steady state costs nothing. Complements (does not
  # replace) alertmanager push — a power flap that silences alertmanager is
  # exactly what this catches.
  - slug: infra-heartbeat-2m
    workflow_type: InfraHeartbeatFlow
    agent_id: pandoras-actor
    schedule_cron: "*/2 * * * *"
    # config.quiet_nodes: [node, ...] — nodes expected to leave/rejoin the
    # swarm (dual-boot boxes etc.); their transitions send a plain FYI ping
    # instead of spawning an investigation. Edit the DB activities row —
    # schedule_sync propagates within ~5 min, no redeploy.
    # config.restuck_hours: hours a service must sit confirmed-stuck before it
    # is re-investigated as ServiceDownProlonged, and the minimum gap between
    # two such re-investigations of the same service (default 24; 0 disables).
    config: {}
    active: true

  # Catches silently-undelivered interaction cards. Slowed 15min → hourly: it
  # has found zero undelivered in practice, so a worst-case ~1h detection lag on
  # a genuinely stuck card is an acceptable trade for 4× fewer runs.
  - slug: delivery-watchdog-hourly
    workflow_type: DeliveryWatchdogFlow
    agent_id: pandoras-actor
    schedule_cron: "0 * * * *"
    config: {}
    active: true

  # Pandora — watchdog over AEGIS's own scheduled flows (#226): N consecutive
  # failures of one workflow_type, plus schedules that have stopped succeeding
  # within a multiple of their own cadence. Alerts are deduped in audit_log,
  # so a flow wedged all day produces one card, not one per tick.
  #
  # ":07 and :37" — every 30 min, which bounds the alert lag on a wedged
  # 5-minute flow to ~30 min (the 2026-08-02 TodoistSync incident ran 25 min
  # unseen). Minutes 7/37 are odd, not multiples of 5, so they miss every
  # */2, */5, */15 and */30 stepper as well as the busy :00 minute; hour is
  # unrestricted, so no daily slot is contended either.
  - slug: flow-health-watchdog-30m
    workflow_type: FlowHealthWatchdogFlow
    agent_id: pandoras-actor
    schedule_cron: "7,37 * * * *"
    # Knobs (all DB-editable on /admin/flows, propagate in <=5 min without a
    # redeploy): consecutive_failures, lookback_hours, stale_multiplier,
    # min_stale_minutes, dedup_hours, recovery_hours, check_stale, silent.
    config: {}
    active: true

  - slug: cert-radar-daily
    workflow_type: CertRadarFlow
    agent_id: pandoras-actor
    schedule_cron: "0 7 * * *"
    config:
      domains:
        - hikmahtech.in
        - aegis-api.hikmahtech.in
        - litellm.hikmahtech.in
        - grafana.hikmahtech.in
        - knowledge.hikmahtech.in
        - temporal.hikmahtech.in
    active: true

  # Sebas — life-document expiry radar (C6): passports, visas, licences,
  # insurance, warranties, medication refills, domains. Reads
  # life.expiring_items and raises one ack card per newly-crossed lead_days
  # threshold; the dedup ledger makes each threshold fire once per expiry
  # cycle, forever.
  #
  # 07:25 UTC: the only free daily slot in the morning band. Hour 7 already
  # holds cert-radar at :00, and :15 is the */15 sweep minute (gtd-clarify,
  # llm-spend-guard) — :25 collides with nothing but the two cheap */5
  # pollers. Sits after cert-radar so the two radars never contend, and hours
  # before money-hygiene (09:00), which is the other card-raising daily flow.
  # (The intel scans used to share this hour; they moved to 01:00-02:00 so
  # they land before the 04:30 briefing that reports them.)
  - slug: expiry-radar-daily
    workflow_type: ExpiryRadarFlow
    agent_id: sebas
    schedule_cron: "25 7 * * *"
    config:
      # Window for `due_within`; per-item lead_days is the real filter.
      lookahead_days: 400
      # Cards bypass the notification budget — hard cap per run. Surplus
      # stays unclaimed and alerts on the next run.
      max_cards: 5
    active: true

  # Pandora — nightly retention prune for unbounded ops tables.
  # Defaults from worker/src/aegis_worker/flows/cleanup.py::_DEFAULT_RETENTIONS.
  # Override per-table via config.retentions if needed.
  - slug: cleanup-daily
    workflow_type: CleanupFlow
    agent_id: pandoras-actor
    schedule_cron: "0 4 * * *"
    config: {}
    active: true

  # Resource-inventory sync — keep `resources` mirroring the canonical
  # workspace hierarchy (the workspace host's ~/Workspace) so alert
  # investigation has the right candidate set. Daily at 05:00 UTC.
  # WorkspaceRepoSyncFlow also mirrors missing checkouts onto the base host
  # (node-a) at the same relative paths, and flags tracked GitHub repos
  # whose AEGIS webhook is missing (detection only, result_summary.
  # missing_webhooks).
  - slug: workspace-repo-sync-daily
    workflow_type: WorkspaceRepoSyncFlow
    agent_id: pandoras-actor
    schedule_cron: "0 5 * * *"
    config:
      min_repos: 5
    active: true

  # Executes AEGIS's own agent-assigned tasks. 3 per tick with a 6h per-task
  # cooldown, so the ~80-task backlog drains over about two days rather than
  # stampeding on the first run.
  - slug: agent-task-15min
    workflow_type: AgentTaskSweepFlow
    agent_id: pandoras-actor
    schedule_cron: "*/15 * * * *"
    active: true
    config: {}
