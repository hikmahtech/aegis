name: "Worker — Test"

# Public repo: test only. Image build + swarm deploy live in the private
# homelab-gitops infra repo (ansible), not here.

# The `paths:` filter must list every input this job's tests READ, not just the
# package under test. `config/**` because tests/conftest.py seeds each test DB
# from config/seed/ and several worker tests parse config/seed/activities.yaml
# directly (test_expiry_radar, test_flow_health, test_daylog, test_registry,
# test_curiosity_card_flow, test_llm_spend_guard); migrations/ + personalities/
# because that same fixture migrates and imports them; admin-panel because
# test_profile_reflection_e2e.py parses InteractionDetail.tsx. Omitting a path
# here silently disarms the tests that validate it (issue #170).

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "core/**"
      - "admin-panel/frontend/src/**"
      - "tests/worker/**"
      - "tests/conftest.py"
      # Test-database names and clean-up; tests/conftest.py imports it (#325).
      - "tests/pg_test_db.py"
      # A shared helper the notes tests import (#514); not under tests/worker/.
      - "tests/notes_vault.py"
      # The chart of accounts the books tests post against (#560); same reason.
      - "tests/books_chart_data.py"
      - "config/**"
      - "migrations/**"
      - "personalities/**"
      - "pyproject.toml"
      # The books tests SKIP without hledger, and this is what installs it
      # — a version bump here must re-run them, or the skip is silent (#170).
      - "docker/install-hledger.sh"
      - ".github/workflows/worker.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "core/**"
      - "admin-panel/frontend/src/**"
      - "tests/worker/**"
      - "tests/conftest.py"
      # Test-database names and clean-up; tests/conftest.py imports it (#325).
      - "tests/pg_test_db.py"
      # A shared helper the notes tests import (#514); not under tests/worker/.
      - "tests/notes_vault.py"
      # The chart of accounts the books tests post against (#560); same reason.
      - "tests/books_chart_data.py"
      - "config/**"
      - "migrations/**"
      - "personalities/**"
      - "pyproject.toml"
      # The books tests SKIP without hledger, and this is what installs it
      # — a version bump here must re-run them, or the skip is silent (#170).
      - "docker/install-hledger.sh"
      - ".github/workflows/worker.yml"

# Cancel superseded runs on the same PR branch — a rapid follow-up push
# obsoletes the in-flight run, and GitHub otherwise executes both to the end.
# Never cancel main pushes: main is what the infra repo builds images from,
# so every merge's final state needs its own verdict.
concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # aegis#164: flows is 88% of the worker test step (each flow test spins its
  # own Temporal test server). Splitting it into its own parallel job pulls
  # the PR gate down toward the non-flows half instead of paying for both
  # sequentially in one job.
  test-flows:
    name: Lint & Test (flows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev
          POSTGRES_DB: aegis
        ports: ["25432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            worker/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "core[dev]" -e "worker[dev]"

      - name: Lint
        run: ruff check worker/src/ tests/worker/ tests/notes_vault.py

      - name: Test
        run: pytest tests/worker/flows -n auto --dist loadfile --timeout=300 -v --tb=short --cov=worker/src/aegis_worker --cov-report=term-missing --cov-report=xml

  test-non-flows:
    name: Lint & Test (non-flows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev
          POSTGRES_DB: aegis
        ports: ["25432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            worker/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "core[dev]" -e "worker[dev]"

      - name: Lint
        run: ruff check worker/src/ tests/worker/ tests/notes_vault.py

      # The money activities drive the journal writer against a real hledger,
      # and those tests SKIP without the binary — a green run that proved
      # nothing. The version and its checksum live in docker/install-hledger.sh,
      # which both images run too. Only this job: the flows job mocks its
      # activities, so it needs hledger only if a flow test ever writes a
      # journal for real.
      - name: Install hledger
        run: |
          sudo ./docker/install-hledger.sh
          hledger --version

      - name: Test
        run: pytest tests/worker/ --ignore=tests/worker/flows -n auto --dist loadfile --timeout=300 -v --tb=short --cov=worker/src/aegis_worker --cov-report=term-missing --cov-report=xml
