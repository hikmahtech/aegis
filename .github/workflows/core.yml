name: "Core — Test"

# Public repo: test only. Image build + swarm deploy live in the private
# homelab-gitops infra repo (ansible), not here — so forks/clones never build
# or deploy, and no infra/registry details leak into the open-source repo.

# The `paths:` filter must list every input this job's tests READ, not just the
# package under test. In particular `config/**`: tests/conftest.py seeds each
# test database with `load_seeds(config/seed)`, and tests/core/test_seed.py,
# test_todoist_seed.py and test_agent_tags.py assert directly against those
# YAML files. Omitting a path here does not merely skip a job — it silently
# disarms the tests that exist to validate that path (issue #170).

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "admin-panel/frontend/src/**"
      # tests/core/test_pwa_manifest.py asserts on the PWA install
      # contract, which lives OUTSIDE src/ (public/sw.js, public/manifest.json,
      # index.html). Without these the sw.js no-fetch-handler guard is
      # silently disarmed by the very edit it exists to catch (#170).
      - "admin-panel/frontend/public/**"
      - "admin-panel/frontend/index.html"
      - "tests/core/**"
      - "tests/api/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "config/**"
      - "migrations/**"
      - "personalities/**"
      # tests/core/test_books_config.py asserts core and worker share one
      # /app/config mount, which is what gives the books ONE checkout.
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/core.yml"
  pull_request:
    branches: [main]
    paths:
      - "core/**"
      - "admin-panel/frontend/src/**"
      # tests/core/test_pwa_manifest.py asserts on the PWA install
      # contract, which lives OUTSIDE src/ (public/sw.js, public/manifest.json,
      # index.html). Without these the sw.js no-fetch-handler guard is
      # silently disarmed by the very edit it exists to catch (#170).
      - "admin-panel/frontend/public/**"
      - "admin-panel/frontend/index.html"
      - "tests/core/**"
      - "tests/api/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "config/**"
      - "migrations/**"
      - "personalities/**"
      # tests/core/test_books_config.py asserts core and worker share one
      # /app/config mount, which is what gives the books ONE checkout.
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/core.yml"

# Cancel superseded runs on the same PR branch; never cancel main pushes —
# main is the deploy source, every merge's final state needs a verdict.
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev
          POSTGRES_DB: aegis
        ports: ["25432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      # `[google]` as well as `[dev]` (#248). Both Dockerfiles install
      # `./core[google]`, so without it CI ran the ONE configuration production
      # never runs. `test_ingest_drive_returns_the_documented_reauth_error`
      # asserts the reauth error names the account's token file — reachable only
      # once `google.auth` imports; absent it, the handler fails one step earlier
      # with `No module named 'google.auth'` and the assertion cannot hold. It
      # merged green because every dev venv has the extra. Measured cost: 14
      # packages, ~112MB, +3.1s on a warm cache — and Core's job sits ~52s under
      # the Worker-bound PR gate, so it buys the coverage for nothing.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "core[dev,google]"

      - name: Lint
        run: ruff check core/src/ tests/core/ tests/api/ tests/integration/ tests/conftest.py

      # tests/core/test_books.py exercises the real journal write protocol —
      # append, `hledger check --strict`, revert-on-failure, commit — against a
      # throwaway git repo, and every one of those tests SKIPS when the binary
      # is absent. Without this step CI reports green while the books' entire
      # safety net goes unrun, which is the #170 failure mode in another guise.
      # Same pinned release and checksum as core/Dockerfile and worker/Dockerfile.
      - name: Install hledger
        env:
          HLEDGER_VERSION: "1.52.3"
          HLEDGER_SHA256: "d14a4fc2ac804b556f481b64e8c54efa380db1ac85b3723c9df7b1eeade74b3a"
        run: |
          curl -fsSL -o /tmp/hledger.tgz \
            "https://github.com/simonmichael/hledger/releases/download/${HLEDGER_VERSION}/hledger-linux-x64.tar.gz"
          echo "${HLEDGER_SHA256}  /tmp/hledger.tgz" | sha256sum -c -
          tar -xzf /tmp/hledger.tgz -C /tmp hledger
          sudo install -m 0755 /tmp/hledger /usr/local/bin/hledger
          rm -f /tmp/hledger.tgz /tmp/hledger
          hledger --version

      - name: Test
        run: pytest tests/core/ tests/api/ tests/integration/ -n auto --dist loadfile --timeout=300 -v --tb=short --cov=core/src/aegis --cov-report=term-missing --cov-report=xml
