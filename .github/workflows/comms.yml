name: "Comms — Test"

# Public repo: test only. Image build + swarm deploy live in the private
# homelab-gitops infra repo (ansible), not here.

# The `paths:` filter must list every input this job's tests READ, not just the
# package under test. aegis-comms has no aegis-core dependency at runtime, but
# this job installs `core[dev]` and tests/conftest.py does `from aegis.config
# import Settings` at import time — so a core change can break collection of
# the whole comms suite. migrations/ and personalities/ are deliberately absent:
# no comms test touches the DB fixture, so the seeding path never runs here.
# Omitting a path silently disarms the tests that validate it (issue #170).

on:
  push:
    branches: [main]
    paths:
      - "comms/**"
      - "core/**"
      - "tests/comms/**"
      - "tests/conftest.py"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/comms.yml"
  pull_request:
    branches: [main]
    paths:
      - "comms/**"
      - "core/**"
      - "tests/comms/**"
      - "tests/conftest.py"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/comms.yml"

# Cancel superseded runs on the same PR branch; never cancel main pushes —
# main is the deploy source, every merge's final state needs a verdict.
concurrency:
  group: comms-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            core/pyproject.toml
            comms/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "core[dev]" -e "comms[dev]"

      - name: Lint
        run: ruff check comms/src/ tests/comms/

      - name: Test
        run: pytest tests/comms/ -n auto --dist loadfile --timeout=300 -v --tb=short --cov=comms/src/aegis_comms --cov-report=term-missing --cov-report=xml
